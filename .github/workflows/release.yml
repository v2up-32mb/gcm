name: Release

# tag 触发：从 tag 检出，打包 Worker 服务端随 release 发布
# workflow_dispatch：可为已存在的 tag 补发 release（tag_name 输入）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '为已存在的 tag 补发 release（如 v0.1.0）；留空则使用当前分支代码'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            echo "checkout_ref=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "tag_name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "checkout_ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # dispatch 模式下 checkout 触发分支（main）：旧 tag（如 v0.1.0）可能尚无 worker/ 目录，
      # Worker 文件独立于 Go 库版本演进；tag push 模式照常从 tag 检出
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.ref) || steps.ref.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Package worker
        run: |
          mkdir -p dist
          cp worker/worker.js dist/worker.js
          cp worker/wrangler.toml dist/wrangler.toml
          cp worker/DEPLOY.md dist/DEPLOY.md
          # 校验 worker.js 非空且语法可解析（node 自检）
          node --check dist/worker.js
          ls -la dist

      - name: Detect prerelease
        run: |
          if echo "${{ steps.ref.outputs.tag_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Generate release notes
        run: |
          {
            echo "## GCM Worker 服务端"
            echo ""
            echo "随 \`worker/\` 目录发布："
            echo ""
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`worker.js\` | Cloudflare Worker 主脚本（\`node --check\` 已校验） |"
            echo "| \`wrangler.toml\` | Wrangler 部署配置（\`[vars]\` 含 \`USER_ID\`/\`FALLBACK_IPS\` 等） |"
            echo "| \`DEPLOY.md\` | 部署与配置说明 |"
            echo ""
            echo "部署：\`wrangler deploy\`（详见 \`DEPLOY.md\`）。"
            echo ""
            echo "客户端侧：\`gcm --worker <domain> --user-id <USER_ID> ...\`"
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.ref.outputs.tag_name }}
          name: "GCM ${{ steps.ref.outputs.tag_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            dist/worker.js
            dist/wrangler.toml
            dist/DEPLOY.md
